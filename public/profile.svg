  </defs>
  <rect width="400" height="400" rx="32" fill="url(#gradBg)" />
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#gradRing)" stroke-width="4" filter="url(#glow)" opacity="0.6" />
  <circle cx="200" cy="150" r="55" fill="none" stroke="url(#gradRing)" stroke-width="5" />
  <path d="M110 310 C110 240, 290 240, 290 310" fill="none" stroke="url(#gradRing)" stroke-width="5" stroke-linecap="round" />
  <text x="200" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="3">RUPIKA C.</text>
